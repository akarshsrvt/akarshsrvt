<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
<style>
  .sA,.sB,.sC,.sD{opacity:0}
  .sA{opacity:1}
  .sA{animation:kA 20s linear infinite}
  .sB{animation:kB 20s linear infinite}
  .sC{animation:kC 20s linear infinite}
  .sD{animation:kD 20s linear infinite}
  @keyframes kA{0%{opacity:1}23%{opacity:1}25%{opacity:0}98%{opacity:0}100%{opacity:1}}
  @keyframes kB{0%{opacity:0}24%{opacity:0}26%{opacity:1}48%{opacity:1}50%{opacity:0}100%{opacity:0}}
  @keyframes kC{0%{opacity:0}49%{opacity:0}51%{opacity:1}73%{opacity:1}75%{opacity:0}100%{opacity:0}}
  @keyframes kD{0%{opacity:0}74%{opacity:0}76%{opacity:1}98%{opacity:1}100%{opacity:0}}

  .blink{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}

  .bob{animation:bob 2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}

  .tapL{animation:tap .35s ease-in-out infinite alternate}
  .tapR{animation:tap .35s ease-in-out .17s infinite alternate}
  @keyframes tap{from{transform:translateY(0)}to{transform:translateY(4px)}}

  .wave{transform-origin:285px 175px;animation:wave .7s ease-in-out infinite}
  @keyframes wave{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}

  .sip{transform-origin:285px 175px;animation:sip 3s ease-in-out infinite}
  @keyframes sip{0%,100%{transform:rotate(8deg)}40%,60%{transform:rotate(-6deg)}}

  .steam{animation:steam 2s ease-out infinite}
  .steam.s2{animation-delay:.6s}
  .steam.s3{animation-delay:1.2s}
  @keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-14px)}}

  .point{transform-origin:285px 175px;animation:point 1s ease-in-out infinite alternate}
  @keyframes point{from{transform:rotate(-4deg)}to{transform:rotate(6deg)}}

  .bulb{transform-box:fill-box;transform-origin:center bottom;animation:pop 20s linear infinite}
  @keyframes pop{0%,75%{transform:scale(0)}79%{transform:scale(1.25)}83%,98%{transform:scale(1)}100%{transform:scale(0)}}
  .glow{animation:glow 1.2s ease-in-out infinite}
  @keyframes glow{0%,100%{opacity:.15}50%{opacity:.55}}

  .code{animation:scroll 8s linear infinite}
  @keyframes scroll{from{transform:translateY(0)}to{transform:translateY(-120px)}}

  .fl{font-family:'Courier New',monospace;font-weight:bold;animation:float 7s linear infinite;opacity:0}
  @keyframes float{0%{transform:translateY(0);opacity:0}15%{opacity:.7}85%{opacity:.5}100%{transform:translateY(-150px);opacity:0}}

  .plant{transform-origin:104px 208px;animation:sway 3s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

  .twinkle{animation:tw 2.5s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}

  text{font-family:'Courier New',monospace}
</style>
<defs>
  <clipPath id="scr"><rect x="388" y="78" width="184" height="104" rx="4"/></clipPath>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#1b1535"/>
  </linearGradient>
</defs>

<!-- background -->
<rect x="2" y="2" width="796" height="296" rx="20" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
<circle class="twinkle" cx="60" cy="30" r="2" fill="#fff"/>
<circle class="twinkle" cx="300" cy="22" r="1.6" fill="#fff" style="animation-delay:.8s"/>
<circle class="twinkle" cx="640" cy="34" r="2" fill="#fff" style="animation-delay:1.4s"/>
<circle class="twinkle" cx="740" cy="90" r="1.6" fill="#fff" style="animation-delay:.4s"/>
<circle class="twinkle" cx="170" cy="130" r="1.4" fill="#fff" style="animation-delay:1.9s"/>

<!-- floating tech symbols -->
<text class="fl" x="620" y="215" font-size="20" fill="#00f7a5">&lt;/&gt;</text>
<text class="fl" x="680" y="230" font-size="18" fill="#8957e5" style="animation-delay:-2.3s">{ }</text>
<text class="fl" x="735" y="220" font-size="18" fill="#58a6ff" style="animation-delay:-4.6s">AI</text>
<text class="fl" x="600" y="235" font-size="16" fill="#f7b500" style="animation-delay:-5.8s">RAG</text>
<text class="fl" x="30" y="225" font-size="16" fill="#58a6ff" style="animation-delay:-1.2s">py</text>
<text class="fl" x="150" y="225" font-size="16" fill="#00f7a5" style="animation-delay:-3.7s">01</text>

<!-- plant -->
<g class="plant">
  <ellipse cx="96" cy="196" rx="8" ry="20" fill="#2ea043" transform="rotate(-25 96 196)"/>
  <ellipse cx="112" cy="194" rx="8" ry="20" fill="#3fb950" transform="rotate(25 112 194)"/>
  <ellipse cx="104" cy="190" rx="7" ry="22" fill="#2ea043"/>
</g>
<rect x="90" y="206" width="28" height="26" rx="4" fill="#c26a3d"/>

<!-- monitor -->
<rect x="472" y="186" width="16" height="42" fill="#30363d"/>
<rect x="445" y="226" width="70" height="6" rx="3" fill="#30363d"/>
<rect x="380" y="70" width="200" height="120" rx="8" fill="#0b1220" stroke="#4b5563" stroke-width="3"/>
<g clip-path="url(#scr)">
  <rect x="388" y="78" width="184" height="104" fill="#0d1117"/>
  <g class="code">
    <g id="rows">
      <rect x="396" y="84" width="90" height="6" rx="3" fill="#ff7b72"/>
      <rect x="410" y="96" width="120" height="6" rx="3" fill="#79c0ff"/>
      <rect x="410" y="108" width="70" height="6" rx="3" fill="#d2a8ff"/>
      <rect x="424" y="120" width="100" height="6" rx="3" fill="#7ee787"/>
      <rect x="424" y="132" width="60" height="6" rx="3" fill="#ffa657"/>
      <rect x="410" y="144" width="110" height="6" rx="3" fill="#79c0ff"/>
      <rect x="396" y="156" width="50" height="6" rx="3" fill="#ff7b72"/>
      <rect x="410" y="168" width="130" height="6" rx="3" fill="#7ee787"/>
      <rect x="424" y="180" width="80" height="6" rx="3" fill="#d2a8ff"/>
      <rect x="396" y="192" width="40" height="6" rx="3" fill="#ff7b72"/>
    </g>
    <use href="#rows" y="120"/>
  </g>
</g>

<!-- character: ears, neck, torso -->
<circle cx="208" cy="110" r="8" fill="#b97b51"/>
<circle cx="292" cy="110" r="8" fill="#b97b51"/>
<rect x="240" y="135" width="20" height="24" fill="#b97b51"/>
<rect x="205" y="150" width="90" height="100" rx="28" fill="#4a78b8"/>
<path d="M232 150 L250 174 L268 150 Z" fill="#3b66a0"/>
<line x1="250" y1="174" x2="250" y2="250" stroke="#3b66a0" stroke-width="3"/>
<circle cx="250" cy="192" r="2.5" fill="#cfe0f5"/>
<circle cx="250" cy="214" r="2.5" fill="#cfe0f5"/>

<!-- head -->
<g class="bob">
  <circle cx="250" cy="105" r="42" fill="#c98d62"/>
  <path d="M207 104 Q205 52 250 52 Q295 52 293 104 Q282 78 250 76 Q218 78 207 104 Z" fill="#1c1410"/>
  <path d="M222 66 Q250 44 282 68 Q262 58 222 66 Z" fill="#1c1410"/>
  <g class="blink"><circle cx="234" cy="108" r="4.5" fill="#1a1a1a"/></g>
  <g class="blink"><circle cx="266" cy="108" r="4.5" fill="#1a1a1a"/></g>
  <circle cx="235.5" cy="106.5" r="1.4" fill="#fff"/>
  <circle cx="267.5" cy="106.5" r="1.4" fill="#fff"/>
  <path d="M226 97 Q234 92 242 96" stroke="#1c1410" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M258 96 Q266 92 274 97" stroke="#1c1410" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="224" cy="120" r="6" fill="#e0805f" opacity=".35"/>
  <circle cx="276" cy="120" r="6" fill="#e0805f" opacity=".35"/>
  <path d="M238 124 Q250 136 262 124" stroke="#5a2d1c" stroke-width="3" fill="none" stroke-linecap="round"/>
</g>

<!-- desk -->
<rect x="20" y="232" width="760" height="14" rx="4" fill="#6b4a35"/>
<rect x="20" y="246" width="760" height="44" fill="#111827"/>
<rect x="330" y="222" width="115" height="10" rx="3" fill="#374151"/>

<!-- speech bubble -->
<g>
  <rect x="14" y="34" width="186" height="48" rx="14" fill="#161b22" stroke="#00f7a5" stroke-width="2"/>
  <path d="M200 52 L214 62 L200 68 Z" fill="#161b22" stroke="#00f7a5" stroke-width="2" stroke-linejoin="round"/>
  <rect x="198" y="52" width="4" height="16" fill="#161b22"/>
  <g class="sA"><text x="107" y="63" text-anchor="middle" font-size="13" fill="#fff">Building AI apps...</text></g>
  <g class="sB"><text x="107" y="63" text-anchor="middle" font-size="13" fill="#fff">Hi, I'm Akarsh!</text></g>
  <g class="sC"><text x="107" y="63" text-anchor="middle" font-size="13" fill="#fff">Coffee break...</text></g>
  <g class="sD"><text x="107" y="63" text-anchor="middle" font-size="13" fill="#fff">Idea! Let's build it</text></g>
</g>

<!-- Scene A: coding -->
<g class="sA">
  <g class="tapL">
    <path d="M215 175 Q240 228 350 218" stroke="#6a9be0" stroke-width="18" fill="none" stroke-linecap="round"/>
    <circle cx="352" cy="218" r="10" fill="#c98d62"/>
  </g>
  <g class="tapR">
    <path d="M285 175 Q330 232 410 218" stroke="#6a9be0" stroke-width="18" fill="none" stroke-linecap="round"/>
    <circle cx="412" cy="218" r="10" fill="#c98d62"/>
  </g>
</g>

<!-- Scene B: waving -->
<g class="sB">
  <path d="M215 175 Q198 205 215 222" stroke="#6a9be0" stroke-width="18" fill="none" stroke-linecap="round"/>
  <circle cx="215" cy="224" r="10" fill="#c98d62"/>
  <g class="wave">
    <path d="M285 175 L338 118" stroke="#6a9be0" stroke-width="18" fill="none" stroke-linecap="round"/>
    <circle cx="342" cy="112" r="12" fill="#c98d62"/>
  </g>
</g>

<!-- Scene C: coffee -->
<g class="sC">
  <path d="M215 175 Q198 205 215 222" stroke="#6a9be0" stroke-width="18" fill="none" stroke-linecap="round"/>
  <circle cx="215" cy="224" r="10" fill="#c98d62"/>
  <g class="sip">
    <path d="M285 175 Q304 170 280 150" stroke="#6a9be0" stroke-width="18" fill="none" stroke-linecap="round"/>
    <rect x="268" y="116" width="26" height="30" rx="5" fill="#f0f0f0"/>
    <path d="M294 124 Q308 130 294 140" stroke="#f0f0f0" stroke-width="4" fill="none"/>
    <rect x="268" y="116" width="26" height="8" rx="4" fill="#8b5a2b"/>
    <circle cx="276" cy="148" r="9" fill="#c98d62"/>
    <path class="steam" d="M274 108 q-5 -8 0 -14 q5 -6 0 -12" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path class="steam s2" d="M282 108 q-5 -8 0 -14 q5 -6 0 -12" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path class="steam s3" d="M290 108 q-5 -8 0 -14 q5 -6 0 -12" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
</g>

<!-- Scene D: idea -->
<g class="sD">
  <path d="M215 175 Q198 205 215 222" stroke="#6a9be0" stroke-width="18" fill="none" stroke-linecap="round"/>
  <circle cx="215" cy="224" r="10" fill="#c98d62"/>
  <g class="point">
    <path d="M285 175 L328 122" stroke="#6a9be0" stroke-width="18" fill="none" stroke-linecap="round"/>
    <circle cx="331" cy="117" r="11" fill="#c98d62"/>
    <rect x="328" y="96" width="6" height="18" rx="3" fill="#c98d62"/>
  </g>
  <g class="bulb">
    <circle class="glow" cx="250" cy="30" r="22" fill="#ffd54a"/>
    <circle cx="250" cy="28" r="12" fill="#ffd54a"/>
    <rect x="244" y="38" width="12" height="8" rx="2" fill="#9ca3af"/>
    <line x1="226" y1="14" x2="231" y2="18" stroke="#ffd54a" stroke-width="3" stroke-linecap="round"/>
    <line x1="274" y1="14" x2="269" y2="18" stroke="#ffd54a" stroke-width="3" stroke-linecap="round"/>
  </g>
</g>
</svg>
